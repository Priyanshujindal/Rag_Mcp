version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: rag-mcp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ai-service:
    build:
      context: ../..
      dockerfile: services/ai-service/Dockerfile
    container_name: rag-mcp-ai
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: rag-mcp-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8001
      STORAGE_DIR: /app/storage
      TRUST_PROXY: "true"
    volumes:
      - api_storage:/app/storage
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: rag-mcp-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  redis_data:
    name: rag_mcp_redis_data
  api_storage:
    name: rag_mcp_api_storage
