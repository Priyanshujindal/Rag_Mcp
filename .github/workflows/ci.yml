name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-test-and-build:
    name: Node Test & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API Tests (Node.js)
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/ci_test
          MONGODB_DB_NAME: Rag_Mcp
          MONGODB_TEST_DB_NAME: Rag_Mcp_test
          JWT_ACCESS_SECRET: dev_ci_access_secret_32_characters_long
          JWT_REFRESH_SECRET: dev_ci_refresh_secret_32_characters_long
          INTERNAL_API_KEY: 0123456789abcdef0123456789abcdef
        run: pnpm --filter @rag-mcp/api test

      - name: Run Web Tests (Node.js)
        run: pnpm --filter @rag-mcp/web test

      - name: Build Chatbot Widget
        run: pnpm --filter @rag-mcp/widget build

      - name: Build Web Frontend
        run: pnpm --filter @rag-mcp/web build

  python-test:
    name: Python AI Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/ai-service/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-service/requirements.txt

      - name: Cache FastEmbed model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fastembed-bge-small-en-v1.5
          restore-keys: |
            fastembed-

      - name: Pre-download FastEmbed model
        run: |
          python -c "from fastembed import TextEmbedding; TextEmbedding(model_name='BAAI/bge-small-en-v1.5')"

      - name: Run Pytest
        env:
          PYTHONPATH: services/ai-service
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: Rag_Mcp
          MONGODB_TEST_DB_NAME: Rag_Mcp_test
          INTERNAL_API_KEY: 0123456789abcdef0123456789abcdef
        run: pytest services/ai-service/tests
